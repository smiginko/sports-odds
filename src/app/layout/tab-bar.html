<nav
  aria-label="Hlavná navigácia (mobil)"
  class="fixed inset-x-0 bottom-0 z-10 grid h-16 grid-cols-3 border-t border-border bg-surface sm:hidden"
>
  <a
    routerLink="/sports"
    routerLinkActive
    ariaCurrentWhenActive="page"
    class="relative flex flex-col items-center justify-center gap-0.5 text-[11px] leading-[14px] font-medium text-ink-muted before:absolute before:inset-x-[30%] before:-top-px before:h-[3px] before:rounded-b-[3px] before:bg-volt before:opacity-0 aria-[current=page]:text-volt aria-[current=page]:before:opacity-100"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linejoin="round"
      aria-hidden="true"
      class="size-[22px]"
    >
      <rect x="3" y="3" width="7" height="7" rx="2" />
      <rect x="14" y="3" width="7" height="7" rx="2" />
      <rect x="3" y="14" width="7" height="7" rx="2" />
      <rect x="14" y="14" width="7" height="7" rx="2" />
    </svg>
    Športy
  </a>

  <a
    routerLink="/favorites"
    routerLinkActive
    ariaCurrentWhenActive="page"
    class="relative flex flex-col items-center justify-center gap-0.5 text-[11px] leading-[14px] font-medium text-ink-muted before:absolute before:inset-x-[30%] before:-top-px before:h-[3px] before:rounded-b-[3px] before:bg-volt before:opacity-0 aria-[current=page]:text-volt aria-[current=page]:before:opacity-100"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linejoin="round"
      aria-hidden="true"
      class="size-[22px]"
    >
      <path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z" />
    </svg>
    Obľúbené
    @if (favorites.count() > 0) {
      <span
        class="absolute top-1.5 left-[calc(50%+6px)] grid h-[18px] min-w-[18px] place-items-center rounded-full bg-volt px-1 font-mono text-[11px] font-bold text-on-volt"
      >
        {{ favorites.count() }}
      </span>
    }
  </a>

  <a
    [routerLink]="auth.isLoggedIn() ? '/client' : '/login'"
    routerLinkActive
    ariaCurrentWhenActive="page"
    class="relative flex flex-col items-center justify-center gap-0.5 text-[11px] leading-[14px] font-medium text-ink-muted before:absolute before:inset-x-[30%] before:-top-px before:h-[3px] before:rounded-b-[3px] before:bg-volt before:opacity-0 aria-[current=page]:text-volt aria-[current=page]:before:opacity-100"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      aria-hidden="true"
      class="size-[22px]"
    >
      <circle cx="12" cy="8" r="4" />
      <path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6" />
    </svg>
    {{ auth.isLoggedIn() ? 'Klient' : 'Prihlásiť' }}
  </a>
</nav>

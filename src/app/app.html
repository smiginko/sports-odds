<header class="border-b border-slate-200 bg-white">
  <nav class="mx-auto flex max-w-5xl items-center gap-8 px-4 py-4" aria-label="Hlavná navigácia">
    <a routerLink="/" class="text-lg font-bold tracking-tight">
      Športové <span class="text-emerald-600">kurzy</span>
    </a>
    <ul class="flex gap-6 text-sm font-medium">
      <li>
        <a
          routerLink="/sports"
          routerLinkActive
          ariaCurrentWhenActive="page"
          class="text-slate-600 hover:text-slate-900 aria-[current=page]:text-emerald-700"
        >
          Športy
        </a>
      </li>
    </ul>

    <div class="ml-auto text-sm font-medium">
      @if (auth.email(); as email) {
        <a
          routerLink="/client"
          routerLinkActive
          ariaCurrentWhenActive="page"
          class="block max-w-48 truncate text-slate-600 hover:text-slate-900 aria-[current=page]:text-emerald-700"
        >
          {{ email }}
        </a>
      } @else {
        <a
          routerLink="/login"
          routerLinkActive
          ariaCurrentWhenActive="page"
          class="text-slate-600 hover:text-slate-900 aria-[current=page]:text-emerald-700"
        >
          Prihlásiť sa
        </a>
      }
    </div>
  </nav>
</header>

<main class="mx-auto max-w-5xl px-4 py-8">
  <router-outlet />
</main>
